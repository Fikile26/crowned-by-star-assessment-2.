<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->

    <header>
        <div class="logo">
            CROWNED BY STAR
        </div>

        <nav>
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="shop.html">Shop</a>
            <a href="contact.html">Contact</a>
            <a href="categories.html">Product Categories</a>
            <a href="cart.html">🛒</a>
        </nav>
    </header>


    <!-- Cart -->

    <section class="cart">

        <h1>Shopping Cart</h1>


        <!-- Product -->

        <div class="cart-item">

            <img src="images/bob-wig.jpg" alt="Baby Premium Donor Hair">


            <div class="cart-info">

                <h2>Baby Premium Donor Hair</h2>

                <p>Premium quality human hair.</p>

                <p class="cart-price">R2,500</p>

            </div>


            <!-- Quantity -->

            <div class="quantity">

                <button>−</button>

                <span>1</span>

                <button>+</button>

            </div>


            <!-- Remove -->

            <button class="remove">
                Remove
            </button>

        </div>


        <!-- Total -->

        <div class="cart-total">

            <h2>Total: R2,500</h2>

            <button class="checkout">
                CHECKOUT
            </button>

        </div>

    </section>


</body>
</html>
